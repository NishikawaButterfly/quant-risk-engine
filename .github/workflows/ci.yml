name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Format
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Types
        run: mypy
      - name: Tests
        run: |
          coverage run -m unittest discover -s tests
          coverage report --fail-under=90

  windows-smoke:
    name: Windows smoke
    runs-on: windows-2025
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m unittest discover -s tests

  packaging:
    name: Packaging
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Check the wheel ships the whole package
        run: |
          python - <<'EOF'
          import pathlib
          import sys
          import zipfile

          wheels = sorted(pathlib.Path("dist").glob("*.whl"))
          sdists = sorted(pathlib.Path("dist").glob("*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              sys.exit(f"expected one wheel and one sdist in dist/, found: {wheels + sdists}")
          shipped = set(zipfile.ZipFile(wheels[0]).namelist())
          expected = {
              f"quantrisk/{path.name}"
              for path in pathlib.Path("src/quantrisk").iterdir()
              if path.is_file()
          }
          missing = sorted(expected - shipped)
          if missing:
              sys.exit(f"{wheels[0].name} is missing {missing}")
          print(f"{wheels[0].name} ships all {len(expected)} files from src/quantrisk")
          EOF
      - name: Install the wheel into a fresh environment
        run: |
          python -m venv .venv-wheel
          .venv-wheel/bin/python -m pip install --upgrade pip
          .venv-wheel/bin/python -m pip install dist/*.whl
      - name: Prove imports resolve to the installed package
        run: |
          .venv-wheel/bin/python -c "import quantrisk; print(quantrisk.__file__); assert 'site-packages' in quantrisk.__file__"
      - name: Test the installed package
        run: .venv-wheel/bin/python -m unittest discover -s tests
      - name: Run the CLI end to end
        run: |
          .venv-wheel/bin/quantrisk validate --spec sample-data/portfolio-spec.json
          .venv-wheel/bin/quantrisk run --spec sample-data/portfolio-spec.json --output "$RUNNER_TEMP/quantrisk-run"
          test -s "$RUNNER_TEMP/quantrisk-run/results.json"
          test -s "$RUNNER_TEMP/quantrisk-run/report.md"
